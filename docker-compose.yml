services:
  cetu-dashboard:
    image: cetu-dashboard:latest
    build: .
    container_name: cetu-dashboard
    ports:
      - "8766:8766"
    volumes:
      - ./backend:/app/backend:ro
      - ./frontend:/app/frontend:ro
      - ./swap_tasks:/app/swap_tasks
    environment:
      MYSQL_HOST: 192.168.16.38
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: creative testing data
      SWAP_TASK_DIR: /app/swap_tasks
    restart: unless-stopped
